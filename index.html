<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Frida à Londres - L'odyssée victorienne</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #1a0f1f;
    color: #f4e6c8;
    font-family: 'Georgia', serif;
    overflow: hidden;
    height: 100%;
    user-select: none;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #game {
    background: #87729a;
    image-rendering: pixelated;
    border: 6px double #c9a96e;
    box-shadow: 0 0 40px rgba(201, 169, 110, 0.5), 0 0 80px rgba(0,0,0,0.8);
    max-width: 100%;
    max-height: 90vh;
  }
  #footer {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: #c9a96e;
    letter-spacing: 1px;
  }
  #footer b { color: #f4e6c8; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="footer">
    ← → ou A/D : marcher &nbsp;•&nbsp; <b>ESPACE</b> ou ↑ : sauter &nbsp;•&nbsp; <b>P</b> : pause &nbsp;•&nbsp; <b>R</b> : recommencer le niveau
  </div>
</div>

<!--
  FRIDA À LONDRES — L'odyssée victorienne
  Un platformer caricatural dans l'Angleterre du 19e siècle

  Ordre de chargement des modules :
    core.js     : doit être en PREMIER (définit canvas, ctx, W, H, TILE, game state)
                  car levels.js calcule LEVELS = RAW_LEVELS.map(parseLevel) au top-level,
                  et parseLevel utilise TILE.
    main.js     : doit être en DERNIER (appelle loop() à la fin du fichier).
    Le reste    : ordre relativement libre, dépendances résolues à l'exécution.
-->
<script src="js/core.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/physics.js"></script>
<script src="js/powers.js"></script>
<script src="js/effects.js"></script>
<script src="js/levels.js"></script>
<script src="js/pickups.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/rendering.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>

</body>
</html>
